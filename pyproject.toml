[project]
name = "aiarchitect-blog-mcp"
version = "0.1.1"
description = "MCP server that exposes the AI아키텍트 (aiarchitect.tistory.com) technical blog — 69 articles — as searchable tools for AI agents."
readme = "README.md"
requires-python = ">=3.10"
# 코드는 MIT, 번들된 글 본문은 별도 커스텀 라이선스(LicenseRef). 자세한 조건은 LICENSE / LICENSE-ARTICLES.
license = "MIT AND LicenseRef-AIArchitect-Articles"
license-files = ["LICENSE", "LICENSE-ARTICLES"]
authors = [{ name = "AI아키텍트" }]
keywords = ["mcp", "model-context-protocol", "blog", "ai-architecture", "rag", "ai-agent"]
# PEP 639: SPDX license 표현식을 쓰므로 License classifier는 넣지 않는다(중복·거부 방지).
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# 상한(<4)으로 비호환 major 자동 선택을 차단. 검증 기준은 uv.lock의 FastMCP 3.x.
dependencies = ["fastmcp>=2.8,<4"]

[project.scripts]
aiarchitect-blog-mcp = "aiarchitect_blog_mcp:main"

[project.urls]
Homepage = "https://aiarchitect.tistory.com/"
Documentation = "https://aiarchitect.tistory.com/63"
"Deployment Guide" = "https://aiarchitect.tistory.com/68"
Source = "https://github.com/aiarchitecturedev/aiarchitect-blog-mcp"
Issues = "https://github.com/aiarchitecturedev/aiarchitect-blog-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiarchitect_blog_mcp"]
# data/(articles_index.json + articles/*.md)는 패키지 하위라 기본 포함됨.

[tool.hatch.build.targets.sdist]
# 배포 표면 최소화: 테스트와 코퍼스 생성 스크립트(scripts/)는 sdist에 넣지 않는다.
# scripts/build_index.py는 유지관리 전용 도구이며 sdist→wheel 빌드에 필요 없다.
# 개인 식별자 denylist(.private-tokens)는 .gitignore·비추적이라 어차피 포함되지 않는다.
include = ["/src", "/README.md", "/LICENSE", "/LICENSE-ARTICLES", "/pyproject.toml", "/uv.lock"]

[dependency-groups]
dev = ["pytest>=8"]
