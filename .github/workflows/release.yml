name: Release

# PyPI Trusted Publishing(OIDC) 전용 워크플로.
# 🔴 PyPI의 신뢰 발행자 설정이 **이 파일명(release.yml)과 environment(pypi)**에 묶인다.
#    파일을 옮기거나 이름을 바꾸면 게시가 거부되므로 PyPI 설정도 같이 고쳐야 한다.
# 게시 권한을 CI(ci.yml)와 분리해, PR마다 도는 워크플로에는 발행 권한이 없도록 한다.

on:
  push:
    tags: ["v*"]
  # 태그를 이미 민 버전을 뒤늦게 게시할 때 쓴다(예: 신뢰 발행자 설정 전에 난 태그).
  # ⚠️ ref를 비우고 브랜치에서 실행하는 쪽이 보통 맞다. 이 워크플로는 체크아웃한 트리의
  #    scripts/verify_dist.py를 쓰는데, 그 스크립트보다 먼저 난 태그에는 파일이 없다.
  #    sdist·wheel은 scripts/·.github/를 포함하지 않으므로, 브랜치에서 빌드해도
  #    산출물 내용은 같은 버전의 태그에서 빌드한 것과 동일하다.
  workflow_dispatch:
    inputs:
      ref:
        description: "체크아웃할 ref (비우면 실행 브랜치). 보통 비워 둔다"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 태그와 pyproject 버전이 어긋난 채로 올라가면 되돌릴 수 없다(PyPI는 재업로드 불가).
      # 태그에서 실행할 때만 강제한다. 브랜치 실행은 pyproject 버전을 그대로 게시한다.
      - name: Check version
        run: |
          ref="${{ inputs.ref || github.ref_name }}"
          version=$(uv version --short)
          case "$ref" in
            v*)
              if [ "$ref" != "v$version" ]; then
                echo "::error::태그($ref)와 pyproject 버전(v$version)이 다릅니다"
                exit 1
              fi
              echo "✅ $ref == v$version" ;;
            *)
              echo "::notice::태그가 아닌 ref($ref)에서 실행 — v$version 을 게시합니다" ;;
          esac

      - name: Run tests
        run: uv run pytest -q

      - name: Build wheel and sdist
        run: uv build

      # 데이터 번들이 빠진 아티팩트가 PyPI로 나가는 것을 막는 마지막 관문.
      - name: Verify artifact contents
        run: uv run python scripts/verify_dist.py dist/

      - name: Verify wheel installs standalone
        run: |
          uv venv /tmp/isolated
          uv pip install --python /tmp/isolated/bin/python dist/*.whl
          cp scripts/verify_dist.py /tmp/verify_dist.py
          cd /tmp && /tmp/isolated/bin/python /tmp/verify_dist.py --installed

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # 🔴 PyPI 신뢰 발행자에 등록한 environment 이름과 반드시 같아야 한다.
    environment:
      name: pypi
      url: https://pypi.org/p/aiarchitect-blog-mcp
    permissions:
      # OIDC 토큰 발급용. 비밀 토큰을 저장소에 두지 않는 대가로 이 권한이 필요하다.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── 공식 MCP Registry 등재 ───────────────────────────────────────────────
  # PyPI 게시 **뒤에** 돈다. 레지스트리가 소유권을 확인할 때 PyPI에 올라간 패키지 설명
  # (=README)에서 `mcp-name:` 표식을 찾기 때문에, 순서가 뒤집히면 반드시 실패한다.
  # 인증은 PyPI와 같은 결의 OIDC — 저장소에 비밀 토큰을 두지 않는다.
  publish-mcp:
    name: publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC 토큰 발급용
      contents: read
    env:
      # 🔴 가변 태그(latest)를 쓰지 않는다 — 서명 검증의 certificate-identity가
      #    이 버전 문자열에 묶여 있어, 올릴 때는 의도적으로 올려야 한다.
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # PyPI는 업로드 직후 잠깐 옛 내용을 주는 일이 있다. 레지스트리는 패키지 설명에서
      # 표식을 찾으므로, 보이기 전에 publish하면 "Package validation failed"로 떨어진다.
      # 그래서 **확인될 때까지 기다렸다가 한 번만** 게시한다(재시도는 중복 게시 위험).
      - name: Wait for PyPI to serve the mcp-name marker
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          name=$(python3 -c "import json;print(json.load(open('server.json'))['name'])")
          url="https://pypi.org/pypi/aiarchitect-blog-mcp/${version}/json"
          echo "확인: $url 에 'mcp-name: $name'"
          for i in $(seq 1 20); do
            if curl -fsSL "$url" | python3 -c "import sys,json; d=json.load(sys.stdin)['info'].get('description') or ''; sys.exit(0 if 'mcp-name: $name' in d else 1)"; then
              echo "✅ ${i}회차에 확인됨"
              exit 0
            fi
            echo "… ${i}/20 아직 안 보인다. 15초 뒤 재시도"
            sleep 15
          done
          echo "::error::PyPI 설명에서 'mcp-name: $name' 을 5분 동안 찾지 못했습니다"
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # 서명을 확인하지 않고 받은 바이너리에 OIDC 토큰을 쥐여 주지 않는다.
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # server.json 의 버전은 저장소가 정본이다(tests/test_docs_consistency.py 가
      # pyproject 와 같은지 대조한다). 여기서 덮어쓰면 그 대조가 무의미해지므로 건드리지 않는다.
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
